name: Cricket Pulse Android cloud build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Recover and extract starter project archive
        run: |
          python3 - <<'PY'
          import base64, io, string, zipfile, zlib
          from pathlib import Path
          raw = Path("starter.zip.base64").read_text().strip()
          alphabet = string.ascii_letters + string.digits + "+/"
          recovered = None
          for pos in range(len(raw) + 1):
              prefix, suffix = raw[:pos], raw[pos:]
              for ch in alphabet:
                  candidate = prefix + ch + suffix
                  candidate += "=" * (-len(candidate) % 4)
                  try:
                      data = base64.b64decode(candidate, validate=True)
                      with zipfile.ZipFile(io.BytesIO(data)) as zf:
                          if zf.testzip() is None and "CricketPulseAndroid/app/src/main/java/com/cricketpulse/app/MainActivity.kt" in zf.namelist():
                              recovered = data
                              break
                  except (ValueError, zipfile.BadZipFile, zlib.error):
                      pass
              if recovered is not None:
                  break
          if recovered is None:
              raise SystemExit("Could not repair starter archive; upload a fresh ZIP.")
          Path("starter.zip").write_bytes(recovered)
          print("Starter ZIP repaired and verified.")
          PY
          unzip -q starter.zip
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CricketPulseAndroid/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures { compose = true }"
          fix = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

          """
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(marker, fix + marker)
              p.write_text(s)
          print("Java and Kotlin JVM targets aligned to 17.")
          PY

      - name: Inspect Android app source
        run: |
          echo "===== MAIN ACTIVITY ====="
          sed -n '1,260p' CricketPulseAndroid/app/src/main/java/com/cricketpulse/app/MainActivity.kt
          echo "===== APP GRADLE ====="
          sed -n '1,220p' CricketPulseAndroid/app/build.gradle.kts
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Accept licenses and install Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test CricketData current matches API
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          key = os.environ.get("CRICKETDATA_API_KEY", "").strip()
          if not key:
              raise SystemExit("CRICKETDATA_API_KEY repository secret is missing or empty.")
          query = urllib.parse.urlencode({"apikey": key, "offset": 0})
          url = "https://api.cricapi.com/v1/currentMatches?" + query
          req = urllib.request.Request(url, headers={"User-Agent": "CricketPulse-API-SmokeTest/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              raise SystemExit("CricketData API HTTP error: " + str(e.code))
          except Exception as e:
              raise SystemExit("CricketData API request failed: " + type(e).__name__)
          if payload.get("status") != "success":
              raise SystemExit("CricketData API returned status=" + str(payload.get("status")) + "; message=" + str(payload.get("message", "no message")))
          matches = payload.get("data") or []
          info = payload.get("info") or {}
          print("CricketData API connection: SUCCESS")
          print("Current matches returned:", len(matches))
          print("API hits today:", info.get("hitsToday", "not supplied"))
          print("API daily limit:", info.get("hitsLimit", "not supplied"))
          for match in matches[:5]:
              teams = match.get("teams") or []
              print("-", " vs ".join(str(t) for t in teams), "|", match.get("matchType", "type n/a"), "|", match.get("status", "status n/a"))
          PY

      - name: Verify Supabase cricket data proxy
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          url = "https://rcydwbzretytoubkwdav.supabase.co/functions/v1/cricket-current-matches"
          anon = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjeWR3YnpyZXR5dG91Ymt3ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MTcxMDIsImV4cCI6MjEwOTM5MzEwMn0.sJH1s3A4n0_mGJnRSfQrgfCrj7i4jJsy_dME9x47SGA"
          req = urllib.request.Request(url, headers={"apikey": anon, "Authorization": "Bearer " + anon})
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              raise SystemExit("Supabase proxy HTTP " + str(e.code) + ": " + body[:300])
          if data.get("status") != "success":
              raise SystemExit("Supabase proxy returned no successful cricket data: " + str(data.get("error", "unknown response")))
          matches = data.get("data") or []
          print("Supabase proxy: SUCCESS")
          print("Current match records:", len(matches))
          for match in matches[:5]:
              print("-", " vs ".join(match.get("teams") or []), "|", match.get("status", "status n/a"))
          PY

      - name: Build debug APK
        working-directory: CricketPulseAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricket-pulse-debug-apk
          path: CricketPulseAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
